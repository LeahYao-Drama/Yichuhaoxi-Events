<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>壹出好戏剧团 - 互动弹幕墙</title>
  <style>
    :root {
      --bg-dark: #0a0a0c;
      --panel-bg: rgba(28, 28, 30, 0.85);
      --accent: #0071e3;
      --accent-hover: #0077ed;
      --text-main: #f5f5f7;
      --text-sub: #86868b;
      --border: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    }

    body {
      background: var(--bg-dark);
      color: var(--text-main);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    .view-container {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* 顶部导航 */
    .top-nav {
      height: 56px;
      background: rgba(18, 18, 20, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .stats {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .badge {
      background: rgba(255, 255, 255, 0.08);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      color: var(--text-sub);
      border: 1px solid var(--border);
    }

    /* 弹幕主舞台 */
    .danmu-stage {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, #1c1c1e 0%, #0a0a0c 100%);
    }

    .danmu-item {
      position: absolute;
      white-space: nowrap;
      font-size: 26px;
      font-weight: 600;
      padding: 6px 18px;
      border-radius: 30px;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      gap: 10px;
      user-select: none;
      pointer-events: none;
      will-change: transform;
    }

    .danmu-name {
      font-size: 14px;
      font-weight: 500;
      opacity: 0.85;
      background: rgba(255, 255, 255, 0.2);
      padding: 2px 8px;
      border-radius: 12px;
    }

    /* 悬浮二维码卡片 */
    .qr-card {
      position: absolute;
      top: 76px;
      right: 24px;
      background: var(--panel-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .qr-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
    }

    .qrcode-wrapper {
      background: #ffffff;
      padding: 10px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr-footer {
      font-size: 12px;
      color: var(--text-sub);
    }

    /* 底部发送条 */
    .bottom-bar {
      padding: 12px 24px;
      background: rgba(18, 18, 20, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-group {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .name-input {
      width: 140px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: var(--text-main);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      outline: none;
    }

    .msg-input {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: var(--text-main);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      outline: none;
    }

    .color-select {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: var(--text-main);
      border-radius: 10px;
      padding: 0 10px;
      outline: none;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-sm {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
    }

    /* 快捷按钮行 */
    .quick-actions {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .quick-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text-sub);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .quick-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    /* 手机端模式样式 */
    .mobile-mode {
      background: #000000;
      overflow-y: auto;
      padding: 20px;
      justify-content: center;
      align-items: center;
    }

    .mobile-card {
      width: 100%;
      max-width: 480px;
      background: #1c1c1e;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border);
    }

    .mobile-header h2 {
      font-size: 22px;
      margin-bottom: 6px;
    }

    .mobile-header p {
      font-size: 13px;
      color: #30d158;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group label {
      font-size: 13px;
      color: var(--text-sub);
    }

    .form-group input,
    .form-group textarea {
      background: #2c2c2e;
      border: 1px solid var(--border);
      color: #fff;
      padding: 12px;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
    }

    .char-count {
      text-align: right;
      font-size: 12px;
      color: var(--text-sub);
    }

    .color-palette {
      display: flex;
      gap: 12px;
    }

    .color-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .color-btn.active {
      border-color: #0071e3;
      transform: scale(1.15);
    }

    .btn-large {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      margin-top: 10px;
    }

    .quick-tags {
      margin-top: 24px;
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }

    .tag-title {
      font-size: 12px;
      color: var(--text-sub);
    }

    .tags-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .tag-item {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 13px;
      cursor: pointer;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
  <!-- 大屏端展示模式 -->
  <div id="screen-view" class="view-container">
    <div class="top-nav">
      <div class="brand">
        <span class="icon">🎭</span>
        <span class="title">壹出好戏剧团 - 互动弹幕墙</span>
      </div>
      <div class="stats">
        <span id="conn-count" class="badge">📡 房间: 壹出好戏剧团</span>
        <span id="danmu-count" class="badge">💬 0 条留言</span>
        <button id="toggle-qr-btn" class="btn-sm">隐藏/显示二维码</button>
      </div>
    </div>

    <!-- 弹幕主舞台 -->
    <div id="danmu-stage" class="danmu-stage"></div>

    <!-- 悬浮扫码卡片 -->
    <div id="qr-card" class="qr-card">
      <div class="qr-header">
        <span class="qr-title">📱 手机扫码发弹幕</span>
      </div>
      <div id="qrcode" class="qrcode-wrapper"></div>
      <div class="qr-footer">
        <span id="room-tip">房间: 壹出好戏剧团</span>
      </div>
    </div>

    <!-- 底部直接发送工具条（支持本地编辑、发送、快捷祝福） -->
    <div class="bottom-bar">
      <div class="input-group">
        <input type="text" id="screen-input-name" placeholder="昵称 / 部门" class="name-input" value="剧团导演" maxlength="15">
        <input type="text" id="screen-input-text" placeholder="在此输入弹幕内容，按回车或点击发射..." class="msg-input" maxlength="100">
        <select id="screen-color" class="color-select">
          <option value="#FFFFFF">白色</option>
          <option value="#FFD60A">明黄</option>
          <option value="#FF375F">粉红</option>
          <option value="#30D158">翠绿</option>
          <option value="#64D2FF" selected>天蓝</option>
          <option value="#BF5AF2">紫色</option>
        </select>
        <button id="screen-send-btn" class="btn-primary">发射 🚀</button>
      </div>
      <div class="quick-actions">
        <span style="font-size: 12px; color: var(--text-sub); line-height: 24px;">快捷弹幕：</span>
        <button class="quick-btn" data-text="前程似锦 ✨">前程似锦 ✨</button>
        <button class="quick-btn" data-text="未来可期 🚀">未来可期 🚀</button>
        <button class="quick-btn" data-text="常回来看看 ❤️">常回来看看 ❤️</button>
        <button class="quick-btn" data-text="江湖路远，有缘再见 🍻">江湖路远，有缘再见 🍻</button>
        <button class="quick-btn" data-text="掌声有请下一位！👏">掌声有请下一位！👏</button>
      </div>
    </div>
  </div>

  <!-- 手机端扫码后展示的发送页面 -->
  <div id="mobile-view" class="view-container mobile-mode" style="display: none;">
    <div class="mobile-card">
      <div class="mobile-header">
        <h2>🎉 壹出好戏剧团弹幕</h2>
        <p id="mobile-status">正在连接大屏幕...</p>
      </div>

      <div class="mobile-form">
        <div class="form-group">
          <label for="mobile-name">你的昵称 / 部门</label>
          <input type="text" id="mobile-name" placeholder="例如: Leah / 观众" maxlength="15">
        </div>

        <div class="form-group">
          <label for="mobile-msg">弹幕内容</label>
          <textarea id="mobile-msg" rows="3" placeholder="说点什么送上祝福吧..." maxlength="100"></textarea>
          <div class="char-count"><span id="char-num">0</span>/100</div>
        </div>

        <div class="form-group">
          <label>弹幕颜色</label>
          <div class="color-palette">
            <button class="color-btn active" data-color="#FFFFFF" style="background: #FFFFFF;"></button>
            <button class="color-btn" data-color="#FFD60A" style="background: #FFD60A;"></button>
            <button class="color-btn" data-color="#FF375F" style="background: #FF375F;"></button>
            <button class="color-btn" data-color="#30D158" style="background: #30D158;"></button>
            <button class="color-btn" data-color="#64D2FF" style="background: #64D2FF;"></button>
            <button class="color-btn" data-color="#BF5AF2" style="background: #BF5AF2;"></button>
          </div>
        </div>

        <button id="mobile-send-btn" class="btn-primary btn-large">🚀 发射到大屏幕</button>
      </div>

      <div class="quick-tags">
        <span class="tag-title">快捷祝福：</span>
        <div class="tags-list">
          <button class="tag-item">前程似锦 ✨</button>
          <button class="tag-item">未来可期 🚀</button>
          <button class="tag-item">常回来看看 ❤️</button>
          <button class="tag-item">江湖路远，有缘再见 🍻</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const targetRoom = urlParams.get('room');

    let danmuCount = 0;
    let selectedColor = '#FFFFFF';

    // 1. 手机端模式
    if (targetRoom) {
      document.getElementById('screen-view').style.display = 'none';
      const mobileView = document.getElementById('mobile-view');
      mobileView.style.display = 'flex';

      const statusText = document.getElementById('mobile-status');
      const nameInput = document.getElementById('mobile-name');
      const msgInput = document.getElementById('mobile-msg');
      const charNum = document.getElementById('char-num');
      const sendBtn = document.getElementById('mobile-send-btn');
      const colorBtns = document.querySelectorAll('.color-btn');
      const tagBtns = document.querySelectorAll('.tag-item');

      const peer = new Peer();
      let conn = null;

      peer.on('open', (id) => {
        statusText.innerText = '正在连接 壹出好戏剧团 大屏幕...';
        conn = peer.connect(targetRoom);

        conn.on('open', () => {
          statusText.innerText = '🟢 已成功连接大屏！随时可发送';
          statusText.style.color = '#30D158';
        });

        conn.on('close', () => {
          statusText.innerText = '🔴 与大屏断开连接';
          statusText.style.color = '#FF453A';
        });
      });

      peer.on('error', (err) => {
        statusText.innerText = '连接出错，请刷新重试';
        statusText.style.color = '#FF453A';
      });

      msgInput.addEventListener('input', () => {
        charNum.innerText = msgInput.value.length;
      });

      colorBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          colorBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          selectedColor = btn.dataset.color;
        });
      });

      tagBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          msgInput.value = btn.innerText;
          charNum.innerText = msgInput.value.length;
        });
      });

      function sendDanmuMobile() {
        const text = msgInput.value.trim();
        if (!text) return;
        const name = nameInput.value.trim() || '剧团观众';

        const payload = {
          name: name,
          text: text,
          color: selectedColor,
          time: Date.now()
        };

        if (conn && conn.open) {
          conn.send(payload);
          msgInput.value = '';
          charNum.innerText = '0';
          sendBtn.innerText = '✅ 发送成功！';
          setTimeout(() => {
            sendBtn.innerText = '🚀 发射到大屏幕';
          }, 1200);
        } else {
          alert('尚未连上大屏，请稍等或刷新重试');
        }
      }

      sendBtn.addEventListener('click', sendDanmuMobile);
      msgInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendDanmuMobile();
        }
      });

    } else {
      // 2. 大屏幕端模式
      const stage = document.getElementById('danmu-stage');
      const danmuCountEl = document.getElementById('danmu-count');
      const connCountEl = document.getElementById('conn-count');
      const qrCard = document.getElementById('qr-card');
      const toggleQrBtn = document.getElementById('toggle-qr-btn');

      const ROOM_ID = 'yichuhaoxi_theater_room_2026';
      const currentUrl = new URL(window.location.href);
      currentUrl.searchParams.set('room', ROOM_ID);
      const mobileUrl = currentUrl.toString();

      // 渲染二维码
      new QRCode(document.getElementById('qrcode'), {
        text: mobileUrl,
        width: 140,
        height: 140,
        colorDark: '#000000',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.H
      });

      let connectedCount = 0;
      const peer = new Peer(ROOM_ID);

      peer.on('open', (id) => {
        connCountEl.innerText = `📡 房间: 壹出好戏剧团`;
      });

      peer.on('connection', (conn) => {
        connectedCount++;
        connCountEl.innerText = `👥 手机在线: ${connectedCount} 人`;

        conn.on('data', (data) => {
          createDanmu(data);
        });

        conn.on('close', () => {
          connectedCount = Math.max(0, connectedCount - 1);
          connCountEl.innerText = `👥 手机在线: ${connectedCount} 人`;
        });
      });

      // 弹幕轨道与平滑滚动算法
      const tracks = 8;
      const trackOccupied = new Array(tracks).fill(0);

      function getAvailableTrack() {
        const now = Date.now();
        let bestTrack = 0;
        let minTime = Infinity;

        for (let i = 0; i < tracks; i++) {
          if (trackOccupied[i] <= now) {
            trackOccupied[i] = now + 2500;
            return i;
          }
          if (trackOccupied[i] < minTime) {
            minTime = trackOccupied[i];
            bestTrack = i;
          }
        }
        trackOccupied[bestTrack] = now + 2500;
        return bestTrack;
      }

      function createDanmu(data) {
        danmuCount++;
        danmuCountEl.innerText = `💬 ${danmuCount} 条留言`;

        const el = document.createElement('div');
        el.className = 'danmu-item';
        el.style.color = data.color || '#FFFFFF';

        const nameSpan = document.createElement('span');
        nameSpan.className = 'danmu-name';
        nameSpan.innerText = data.name || '剧团同仁';

        const textSpan = document.createElement('span');
        textSpan.innerText = data.text;

        el.appendChild(nameSpan);
        el.appendChild(textSpan);
        stage.appendChild(el);

        const trackIndex = getAvailableTrack();
        const stageHeight = stage.clientHeight || window.innerHeight - 140;
        const trackHeight = Math.max(45, stageHeight / (tracks + 1));
        const topPosition = 20 + trackIndex * trackHeight;

        el.style.top = `${topPosition}px`;
        const stageWidth = stage.clientWidth || window.innerWidth;
        const duration = Math.random() * 4 + 7; // 7 ~ 11 秒

        const startX = stageWidth;
        el.style.transform = `translateX(${startX}px)`;
        el.getBoundingClientRect(); // 强制重绘

        const endX = -el.offsetWidth - 100;
        el.style.transition = `transform ${duration}s linear`;
        el.style.transform = `translateX(${endX}px)`;

        setTimeout(() => {
          if (el.parentNode) {
            el.parentNode.removeChild(el);
          }
        }, duration * 1000 + 500);
      }

      // 底部控制台发送
      const screenName = document.getElementById('screen-input-name');
      const screenText = document.getElementById('screen-input-text');
      const screenColor = document.getElementById('screen-color');
      const screenSend = document.getElementById('screen-send-btn');

      function sendFromScreen() {
        const text = screenText.value.trim();
        if (!text) return;
        const name = screenName.value.trim() || '剧团导演';
        const color = screenColor.value;

        createDanmu({
          name: name,
          text: text,
          color: color
        });
        screenText.value = '';
      }

      screenSend.addEventListener('click', sendFromScreen);
      screenText.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') sendFromScreen();
      });

      // 快捷按钮绑定
      document.querySelectorAll('.quick-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          screenText.value = btn.dataset.text;
          screenText.focus();
        });
      });

      toggleQrBtn.addEventListener('click', () => {
        qrCard.style.display = qrCard.style.display === 'none' ? 'flex' : 'none';
      });

      // 欢迎演示弹幕
      setTimeout(() => {
        createDanmu({ name: '后台导演', text: '欢迎来到「壹出好戏剧团」告别与互动弹幕墙！🎉', color: '#FFD60A' });
      }, 1000);
    }
  </script>
</body>
</html>
